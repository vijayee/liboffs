name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compiler: gcc
            cxx_compiler: g++
            build_type: Debug
          - compiler: gcc
            cxx_compiler: g++
            build_type: Release
          - compiler: clang
            cxx_compiler: clang++
            build_type: Debug
          - compiler: clang
            cxx_compiler: clang++
            build_type: Release

    steps:
      - uses: actions/checkout@v4
        with:
          # poll-dancer and msquic (whose quictls/xdp sub-builds have nested
          # submodules of their own) are ExternalProject source dirs consumed
          # directly off the checkout; a plain checkout leaves them empty and
          # configure fails with "not an existing non-empty directory".
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev clang

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        env:
          # Both compilers must come from the matrix: msquic keys its warning
          # flags (including the clang-only -Wno-microsoft-anon-tag
          # suppression its headers need) off CMAKE_CXX_COMPILER_ID, so an
          # unmatched default C++ compiler fails its -Werror warnings build.
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.cxx_compiler }}

      - name: Build
        run: cmake --build build --target testliboffs -j$(nproc)

      - name: Test
        run: cd build && ./test/testliboffs
